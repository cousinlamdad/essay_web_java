spring.application.name=essay-web
server.port=${PORT:3001}

# Optionally import .env so DB_* / PORT values can live there (same keys as .env.example)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:essay_web}
spring.datasource.username=${DB_USER:essay_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.messages.basename=messages
spring.messages.encoding=UTF-8
