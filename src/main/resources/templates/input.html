<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title}">Essay Web</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <header th:replace="~{fragments :: header}"></header>
    <main>
        <section>
            <h2 th:text="#{nav.input}">Upload</h2>
            <form th:action="@{/essays}" method="post">
                <div>
                    <label for="title" th:text="#{input.title}">Title</label>
                    <input id="title" name="title" type="text" th:value="${title}" required>
                </div>
                <div>
                    <label for="content" th:text="#{input.content}">Content</label>
                    <textarea id="content" name="content" rows="10" th:text="${content}"></textarea>
                </div>
                <button type="submit" th:text="#{input.submit}">Upload Essay</button>
            </form>
            <p class="status" th:if="${status != null}" th:text="#{${status}}"></p>
            <p class="status error" th:if="${error != null}" th:text="#{${error}}"></p>
        </section>
    </main>
</div>
</body>
</html>
